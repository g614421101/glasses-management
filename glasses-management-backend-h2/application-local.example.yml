app:
  invite-code: replace-with-your-private-invite-code

glasses:
  admin:
    username: admin
    # ── 管理员初始密码（统一预设策略）──────────────────────────────
    # password 与 password-hash 二选一，两者都留空时不做自动创建，
    # 首次打开页面会在登录页引导完成初始化（需邀请码）。
    # password: replace-with-a-strong-initial-admin-password
    # password-hash: $2a$10$...（BCrypt 哈希，避免明文落盘）
    # force-reset-password: true   # 忘记密码时临时置 true，启动后重置为随机强密码（日志打印一次）
    real-name: 系统管理员
    enabled: true

spring:
  datasource:
    # The H2 URL has a safe default in application.yml; override it only when needed.
    url: jdbc:h2:file:./data/glasses_management;MODE=MySQL;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
