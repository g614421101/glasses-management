# 生产环境配置 (打包成 EXE 时自动激活)
# 关闭 MyBatis SQL 日志输出，避免终端日志过于冗长
mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  file:
    # app.home 由 Electron 桌面版传入（指向 userData）；jpackage 原生包未设置时回退用户主目录
    path: ${app.home:${user.home}/.glasses_management_mysql}/logs
  level:
    root: INFO
